name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true          # screenshot goldens are LFS objects (.gitattributes)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21   # LTS, and what gradle/gradle-daemon-jvm.properties pins; AGP 9 needs 17+
      - uses: gradle/actions/setup-gradle@v6   # caching + wrapper validation

      # detekt, ktlintCheck, :app:lintDebug, unit tests, the screenshot goldens and the release
      # build (R8, lintVital — unsigned here, since no keystore is restored, and with the Kotzilla
      # plugin off; both still exercise R8, which is the point). Exits non-zero if any layer fails,
      # and skips the instrumented layer since no device is attached — so no workflow-side logic is
      # needed. Note that none of the three analysers carries a baseline, by design (detekt's was
      # deleted in 6ab505d, ktlint never had one): any finding fails the build. Fix the finding,
      # don't regenerate a baseline. ktlint's half is `./gradlew ktlintFormat`.
      - run: scripts/run-tests.sh --host-only

      - run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-summary
          path: |
            app/build/test-summary/
            app/build/reports/
          if-no-files-found: ignore

  # The instrumented suite — the only layer that needs a real device, and it cannot run on a GitHub
  # runner: the APK is arm64-only by design, so an x86_64 emulator refuses it and the arm64 macOS
  # runners have no nested virtualisation. Test Lab has arm64 virtual devices. scripts/testlab.sh
  # builds the APKs and runs the matrix; it carries the device choice, the quota arithmetic and the
  # history behind both, and is the same command a developer runs before pushing.
  #
  # Main pushes only. PRs keep the host-side suite. Quota is what makes that gate worth keeping: the
  # Spark plan allows 10 virtual and 5 physical device executions per day, counted per device in the
  # matrix, so the `ci` matrix spends 2 virtual + 1 physical a run — five main pushes in a day, with
  # neither bucket running out ahead of the other. The day is Pacific, not local.
  testlab:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks]
    runs-on: ubuntu-latest
    # Has to clear the matrix's own --timeout 25m plus the build and upload ahead of it, which run
    # about five minutes cold. Any tighter and a test that actually reached its Test Lab bound would
    # be killed here first: the job reads as cancelled rather than failed, the matrix carries on in
    # the cloud unwatched, and the execution is spent with nothing to show for it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7   # no lfs; debug.keystore is committed and signs the test APKs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # gcloud is preinstalled on ubuntu runners.
      - name: Run instrumented tests on Test Lab
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: scripts/testlab.sh ci

  # Every green main push reaches testers, with no manual step. PRs never get here.
  distribute:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, testlab]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # versionCode is the commit count
          lfs: true        # not for goldens — the release build reads the LFS-tracked baseline
                           # profile, and a pointer file fails expandReleaseArtProfileWildcards
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing
        env:
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KOTZILLA_JSON_BASE64: ${{ secrets.KOTZILLA_JSON_BASE64 }}
        run: scripts/restore-signing.sh

      # baseVersion is the latest tag reachable from HEAD, so testers see 1.3.348-style versions
      # that line up with the tagged releases instead of a hardcoded base.
      - name: Build signed release APK
        run: |
          TAG=$(git describe --tags --abbrev=0)
          ./gradlew :app:assembleRelease \
            -PbuildNumber=$(git rev-list --count HEAD) \
            -PbaseVersion=${TAG#v}

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?set the FIREBASE_SERVICE_ACCOUNT repository secret (see docs/RELEASING.md)}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@15 appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app 1:967566106537:android:1b97dedaa2eec8bdbeeeb8 \
            --groups testers \
            --release-notes "main @ ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
