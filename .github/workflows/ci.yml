name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true          # screenshot goldens are LFS objects (.gitattributes)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21   # LTS; AGP 9 needs 17+, Gradle 9.6.1 fully supports 21
      - uses: gradle/actions/setup-gradle@v6   # caching + wrapper validation

      # detekt, :app:lintDebug, unit tests and the screenshot goldens. Exits non-zero if any
      # layer fails, and skips the instrumented layer since no device is attached — so no
      # workflow-side logic is needed. Note detekt has no baseline (deleted in 6ab505d): any
      # finding fails the build, by design. Fix the finding, don't regenerate a baseline.
      - run: scripts/run-tests.sh --host-only

      - run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-summary
          path: |
            app/build/test-summary/
            app/build/reports/
          if-no-files-found: ignore

  # The instrumented suite — the only layer that needs a real device, and the only place a release
  # APK's R8 output ever gets exercised before testers see it. It cannot run on a GitHub runner: the
  # APK is arm64-only by design, so an x86_64 emulator refuses it with INSTALL_FAILED_NO_MATCHING_ABIS
  # and the arm64 macOS runners have no nested virtualisation. Test Lab has arm64 virtual devices.
  #
  # Main pushes only. PRs keep the host-side suite. Quota is what makes that gate worth keeping: the
  # Spark plan allows 10 virtual and 5 physical device executions per day, counted per device in the
  # matrix, so the three below spend 2 virtual + 1 physical a run — five main pushes in a day before
  # the physical quota is the binding one. `gcloud alpha services quota list
  # --service=testing.googleapis.com` prints the live numbers.
  testlab:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7   # no lfs; debug.keystore is committed and signs the test APKs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      # gcloud is preinstalled on ubuntu runners. LiveEndpointTest skips itself here: its .test.env
      # instrumentation extras are absent, and its server is not reachable from Google's network
      # anyway. BrowseCostBenchmark is @Ignore'd and costs no quota.
      - name: Run instrumented tests on Test Lab
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?set the FIREBASE_SERVICE_ACCOUNT repository secret (see docs/RELEASING.md)}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          gcloud auth activate-service-account --key-file "$RUNNER_TEMP/firebase-sa.json"
          gcloud config set project jellyshelf-3dfc8
          # Three devices, spread across the axes one image cannot cover: API level, form factor,
          # and emulated vs real silicon. They run in parallel, so the matrix costs the slowest one
          # rather than the sum — measured at about five minutes for three.
          #   MediumPhone.arm 36 — the everyday baseline this job has always run.
          #   MediumTablet.arm 35 — the other form factor, and an API level between the two ends.
          #   redfin 30 — a physical Pixel 5 at exactly minSdk, the floor the app claims to support
          #     and the one API level nothing else exercises. Physical also means real hardware
          #     codecs behind the playback tests. High capacity in `list-device-capacities`, so it
          #     queues quickly, and it is the same model kept on the desk — a red matrix here
          #     reproduces over adb in under a minute.
          #
          # Adding API 30 on 2026-08-06 turned up two test defects that no other device could see,
          # both since fixed: an assertion reading SQLite plans by text (pre-3.36 spells a scan
          # `SCAN TABLE videos`, so assertNoTableScan matched nothing and passed while a real table
          # scan went by), and a persistence wait that watched one flow collection for an update
          # DataStore on API 30 intermittently never delivers. See those two test files for the
          # detail; both were confirmed against this exact matrix before it was committed.
          #
          # MediumPhone_ps16k.arm 37 is the one to add next and cannot be added yet: it is the only
          # image running API 37 (targetSdk) and the only one with 16 KB memory pages, which matter
          # because the APK ships five native libraries. But every UI test fails there on
          # `NoSuchMethodException: android.hardware.input.InputManager.getInstance` — the test
          # framework's input injection, not this app: its 90 failures were exactly the tests that
          # inject touches, while every DAO, sync and serialization test passed. Revisit when
          # androidx.test and compose-ui-test support API 37.
          gcloud firebase test android run --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=36 \
            --device model=MediumTablet.arm,version=35 \
            --device model=redfin,version=30 \
            --timeout 15m

  # Every green main push reaches testers, with no manual step. PRs never get here.
  distribute:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, testlab]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # versionCode is the commit count
          lfs: true        # not for goldens — the release build reads the LFS-tracked baseline
                           # profile, and a pointer file fails expandReleaseArtProfileWildcards
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing
        env:
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: scripts/restore-signing.sh

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease -PbuildNumber=$(git rev-list --count HEAD)

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?set the FIREBASE_SERVICE_ACCOUNT repository secret (see docs/RELEASING.md)}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@15 appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app 1:967566106537:android:1b97dedaa2eec8bdbeeeb8 \
            --groups testers \
            --release-notes "main @ ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
