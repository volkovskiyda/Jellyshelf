name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true          # screenshot goldens are LFS objects (.gitattributes)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21   # LTS, and what gradle/gradle-daemon-jvm.properties pins; AGP 9 needs 17+
      - uses: gradle/actions/setup-gradle@v6   # caching + wrapper validation

      # detekt, :app:lintDebug, unit tests and the screenshot goldens. Exits non-zero if any
      # layer fails, and skips the instrumented layer since no device is attached — so no
      # workflow-side logic is needed. Note detekt has no baseline (deleted in 6ab505d): any
      # finding fails the build, by design. Fix the finding, don't regenerate a baseline.
      - run: scripts/run-tests.sh --host-only

      - run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-summary
          path: |
            app/build/test-summary/
            app/build/reports/
          if-no-files-found: ignore

  # The instrumented suite — the only layer that needs a real device. It cannot run on a GitHub
  # runner: the APK is arm64-only by design, so an x86_64 emulator refuses it with
  # INSTALL_FAILED_NO_MATCHING_ABIS and the arm64 macOS runners have no nested virtualisation. Test
  # Lab has arm64 virtual devices.
  #
  # What it installs is the debug APK, and so does the second matrix in release.yml, which means R8's
  # output is never instrumented anywhere: a keep-rule regression survives every gate and first shows
  # up in a tester's crash report. Closing that needs testBuildType = "release" plus keep rules for
  # the test APK itself — a change of its own, not a workflow edit. Worth knowing when reading a
  # green run: it says nothing about the minified build.
  #
  # Main pushes only. PRs keep the host-side suite. Quota is what makes that gate worth keeping: the
  # Spark plan allows 10 virtual and 5 physical device executions per day, counted per device in the
  # matrix, so the three below spend 2 virtual + 1 physical a run — five main pushes in a day, with
  # neither bucket running out ahead of the other. The day is Pacific, not local. `gcloud alpha
  # services quota list --service=testing.googleapis.com` prints the live numbers.
  testlab:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks]
    runs-on: ubuntu-latest
    # Has to clear the matrix's own --timeout 25m plus the build and upload ahead of it, which run
    # about five minutes cold. Any tighter and a test that actually reached its Test Lab bound would
    # be killed here first: the job reads as cancelled rather than failed, the matrix carries on in
    # the cloud unwatched, and the execution is spent with nothing to show for it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7   # no lfs; debug.keystore is committed and signs the test APKs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      # gcloud is preinstalled on ubuntu runners. LiveEndpointTest skips itself here: its .test.env
      # instrumentation extras are absent, and its server is not reachable from Google's network
      # anyway. BrowseCostBenchmark is @Ignore'd and costs no quota.
      - name: Run instrumented tests on Test Lab
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?set the FIREBASE_SERVICE_ACCOUNT repository secret (see docs/RELEASING.md)}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          gcloud auth activate-service-account --key-file "$RUNNER_TEMP/firebase-sa.json"
          gcloud config set project jellyshelf-3dfc8
          # Three devices, each carrying something none of the others do, and no two overlapping on
          # any axis — API level, form factor, orientation, emulated vs real silicon. They run in
          # parallel, so the matrix costs the slowest one rather than the sum, around five minutes.
          #   MediumTablet.arm 30 landscape — minSdk, the tablet form factor and the only landscape
          #     window, in one execution. Both defects this level has caught were platform behaviour
          #     rather than layout (see below), so carrying minSdk on the tablet rather than a phone
          #     costs nothing real and saves an execution. What it gives up is a bug living
          #     specifically in phone layout at API 30; phone layout is covered at 35 and 36, so that
          #     is a narrow gap and a deliberate one.
          #     Landscape since 2026-08-08, and rather than portrait rather than as well as it,
          #     because orientation is a device key of its own: Test Lab bills per model, version
          #     and orientation, so a fourth entry would cost a third virtual execution and take the
          #     ceiling below from five pushes a day to three. Landscape is the harsher of the two
          #     at 800x500 dp, where a full-width 16:9 thumbnail is 450 dp tall and pushes a whole
          #     screen below the fold — nine DetailContentTest cases failed that way on a build this
          #     matrix had already passed in portrait. What it gives up is a 500x800 window, the
          #     mild middle ground between landscape and a phone, and nothing about the API 30
          #     platform behaviour below depends on which way up the device is.
          #   MediumPhone.arm 36 — phone layout at the level most installs actually run.
          #   shiba 35 — a physical Pixel 8: real silicon, and so real hardware codecs behind the
          #     playback tests, which no emulator exercises. High capacity, so it barely queues.
          #     Pinned to 35 deliberately — see below, where API 36 on physical hardware is why this
          #     is a Pixel 8 at 35 rather than the newest phone in the catalogue.
          #
          # Adding API 30 on 2026-08-06 turned up two test defects that no other device could see,
          # both since fixed: an assertion reading SQLite plans by text (pre-3.36 spells a scan
          # `SCAN TABLE videos`, so assertNoTableScan matched nothing and passed while a real table
          # scan went by), and a persistence wait that watched one flow collection for an update
          # DataStore on API 30 intermittently never delivers. See those two test files for the
          # detail. Both fixes were confirmed at API 30 on Test Lab, virtual and physical alike.
          #
          # Quota, since it decides how many devices fit: the Spark plan allows ten virtual and five
          # physical executions a day, counted per device. Two virtual and one physical a run puts
          # the ceiling at five pushes to main in a day, and both buckets land on five, so neither
          # runs out ahead of the other. A fourth device costs two pushes a day whichever kind it
          # is, which is what pairing minSdk with the tablet buys back.
          #
          # Why no physical device at API 36, which is where most installs are. On a physical device
          # every UI test can fail with `NoSuchMethodException:
          # android.hardware.input.InputManager.getInstance` — the test framework's input injection,
          # not this app: it takes down exactly the 90 tests that inject touches and leaves every
          # DAO, sync and serialization test passing. It is not the API level, and not one bad
          # model. Measured 2026-08-06: frankel (Pixel 10) failed; tokay (Pixel 9) passed 205/205 and
          # then failed the same way eight minutes later on the same APK, one run's logcat carrying
          # 360 mentions of that method and the other none. One model at one version is not one
          # build on Test Lab — the pool serves whichever unit is free, and some Android 16 units
          # have already dropped the method. So a physical device at 36 is a coin flip until
          # androidx.test catches up, while 35 and below cannot be served a build new enough to have
          # lost it. Emulated 36 is unaffected and covers the level.
          #
          # MediumPhone_ps16k.arm 37 is out for the same reason and will not come back sooner: the
          # only image running API 37 (targetSdk) and the only one with 16 KB memory pages, which
          # matter because the APK ships five native libraries.
          gcloud firebase test android run --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=MediumTablet.arm,version=30,orientation=landscape \
            --device model=MediumPhone.arm,version=36 \
            --device model=shiba,version=35 \
            --timeout 25m

  # Every green main push reaches testers, with no manual step. PRs never get here.
  distribute:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, testlab]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # versionCode is the commit count
          lfs: true        # not for goldens — the release build reads the LFS-tracked baseline
                           # profile, and a pointer file fails expandReleaseArtProfileWildcards
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing
        env:
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: scripts/restore-signing.sh

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease -PbuildNumber=$(git rev-list --count HEAD)

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?set the FIREBASE_SERVICE_ACCOUNT repository secret (see docs/RELEASING.md)}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@15 appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app 1:967566106537:android:1b97dedaa2eec8bdbeeeb8 \
            --groups testers \
            --release-notes "main @ ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
