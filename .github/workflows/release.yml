name: Release

# Only a manually pushed v* tag publishes to the Releases page — that is what keeps it a curated
# archive rather than a build log. Continuous delivery to testers is ci.yml's distribute job; a tag
# feeds the same App Distribution channel as well, so testers who are behind get offered the
# tag-named build rather than one named under the previous tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # gh release create

# One run per tag. Tags are unique, so this is not about ordinary pushes racing — it is about a tag
# that gets deleted and re-pushed, or a re-run started while the original is still going, ending with
# two runs calling `gh release create` on the same name. Never cancel-in-progress: a run interrupted
# between the release being created and its assets being uploaded leaves a published release with
# nothing attached, which is worse than waiting.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag can be pushed at any commit in the repository, including one that never went through a pull
  # request. Everything downstream assumes otherwise: the device matrix below is chosen to complement
  # what ci.yml already ran on this commit, and skips whole API levels on that basis, so a tag off
  # main would be tested by three devices in total rather than six. `on: push: tags` cannot express a
  # branch filter, so the check has to be a job — and it has to come first, before the run spends
  # Test Lab quota that a bad tag can never earn back.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # ancestry, so the whole history rather than the tagged commit alone
      - name: Refuse a tag that is not on main
        run: |
          set -euo pipefail
          # The checkout leaves the runner on a detached tag with no branch refs guaranteed, so fetch
          # main explicitly rather than trusting one to be there.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at ${GITHUB_SHA::7}, which is not on main. Tags are cut from main only — move the tag and push it again."
            exit 1
          fi
      # The build adds the patch, so a v1.15.1 tag would publish 1.15.1.0. The release job would
      # refuse it anyway, in the same script — this only moves the refusal ahead of the Test Lab run.
      - name: Refuse a tag that is not v<major>.<minor>
        run: scripts/version.sh name "$GITHUB_REF_NAME" > /dev/null

  # A second instrumented pass, on three devices ci.yml never runs. The tag always points at a commit
  # that already went green on main, so repeating that matrix would tell us nothing — every device
  # in the `release` matrix is chosen for what the CI three do not carry; scripts/testlab.sh holds
  # the list and the reasoning, and is the same command a developer runs before pushing.
  #
  # Quota: 2 virtual + 1 physical, on top of the 2 + 1 the same commit already spent when it landed
  # on main. The Spark plan allows 10 and 5 a Pacific day, so a tag only runs dry if it goes out on a
  # day that already saw four pushes to main. If that happens the tag exists but nothing publishes —
  # re-run this job the next day and the release job follows; the tag never needs to move.
  testlab:
    needs: [guard]   # never spend an execution on a tag that is not on main
    runs-on: ubuntu-latest
    # Same reasoning as ci.yml: has to clear the matrix's own --timeout 25m plus the build ahead of
    # it, or a test that reached its Test Lab bound gets killed here first and the run reads as
    # cancelled rather than failed.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7   # no lfs; debug.keystore is committed and signs the test APKs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Run instrumented tests on Test Lab
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: scripts/testlab.sh release

  release:
    needs: [testlab]   # nothing reaches the Releases page until the matrix above is green
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # versionCode is the commit count
          lfs: true        # not for goldens — the release build reads the LFS-tracked baseline
                           # profile, and a pointer file fails expandReleaseArtProfileWildcards
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing
        env:
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KOTZILLA_JSON_BASE64: ${{ secrets.KOTZILLA_JSON_BASE64 }}
        run: scripts/restore-signing.sh

      # versionName is <tag>.<commits since the tag> — the same rule as the App Distribution builds,
      # and always <tag>.0 here, since this builds the tagged commit itself — so a release needs no
      # edit to build.gradle.kts and the tag can never drift from what the APK reports. Assigned
      # first for the reason ci.yml gives.
      - name: Build signed release APK
        run: |
          CODE=$(scripts/version.sh code)
          NAME=$(scripts/version.sh name "$GITHUB_REF_NAME")
          ./gradlew :app:assembleRelease -PbuildNumber="$CODE" -PversionName="$NAME"

      # The same channel every main push feeds, and the same group. The tagged commit itself already
      # reached testers when it landed on main — under the previous tag's name and this same
      # versionCode — and the in-app check only offers a strictly greater versionCode, so testers
      # already on this commit are not prompted again; this upload is for the ones who are behind,
      # and it is what keeps the build in testers' hands named after the tag it belongs to.
      # Deliberately ahead of the Releases step: re-uploading the same binary is deduplicated by
      # Firebase, while `gh release create` fails once the release exists, so with this order a
      # failed run can simply be re-run.
      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?set the FIREBASE_SERVICE_ACCOUNT repository secret (see docs/RELEASING.md)}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          NAME=$(scripts/version.sh name "$GITHUB_REF_NAME")
          CODE=$(scripts/version.sh code)
          # What the update dialog shows: the full version, then every commit subject since the
          # previous tag — the same ground --generate-notes covers on the release page below. The
          # first tag ever has no predecessor, in which case the whole history is the changelog.
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          NOTES="v$NAME ($CODE)"$'\n\n'"$(git log ${PREV:+$PREV..}HEAD --pretty='- %s')"
          npx firebase-tools@15 appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app 1:967566106537:android:1b97dedaa2eec8bdbeeeb8 \
            --groups testers \
            --release-notes "$NOTES"

      # The mapping is not optional: R8 is on, so without the file from this exact build no crash
      # report from this release can be read. Crashlytics holds its own copy (the build uploads it);
      # this one is for anyone reading a stack trace out of a GitHub issue.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Assets and title carry the versionCode as well as the APK's versionName. versionCode is
          # the one identifier shared with the App Distribution builds, so mapping-1.15.0.560.txt can
          # be matched to a crash by hand — and the app's update check reads the APK's versionCode
          # out of its asset name (APK_ASSET in GitHubReleaseSource.kt).
          #
          # The separator before the versionCode is a dot, not the hyphen that would read better.
          # Builds up to v1.14 parse only `\.(\d+)\.apk$`, and to them a hyphenated release does not
          # exist: they would say "You're up to date" for good. The parser has accepted both since
          # the release after v1.14, so once that release is out, switch both names to
          # "$NAME-$CODE" — anyone still on v1.14 or older then updates by hand, once.
          NAME=$(scripts/version.sh name "$GITHUB_REF_NAME")
          CODE=$(scripts/version.sh code)
          cp app/build/outputs/apk/release/app-release.apk "jellyshelf-$NAME.$CODE.apk"
          cp app/build/outputs/mapping/release/mapping.txt "mapping-$NAME.$CODE.txt"
          gh release create "$GITHUB_REF_NAME" "jellyshelf-$NAME.$CODE.apk" "mapping-$NAME.$CODE.txt" \
            --title "v$NAME ($CODE)" \
            --generate-notes
