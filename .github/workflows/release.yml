name: Release

# Only a manually pushed v* tag publishes to the Releases page — that is what keeps it a curated
# archive rather than a build log. Continuous delivery to testers is ci.yml's distribute job.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # gh release create

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # versionCode is the commit count
          lfs: true        # not for goldens — the release build reads the LFS-tracked baseline
                           # profile, and a pointer file fails expandReleaseArtProfileWildcards
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing
        env:
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: scripts/restore-signing.sh

      # versionName comes from the tag and versionCode from the commit count, so a release needs no
      # edit to build.gradle.kts and the tag can never drift from what the APK reports.
      - name: Build signed release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PbuildNumber=$(git rev-list --count HEAD) \
            -PreleaseVersion=${GITHUB_REF_NAME#v}

      # The mapping is not optional: R8 is on, so without the file from this exact build no crash
      # report from this release can be read. Crashlytics holds its own copy (item 07); this one is
      # for anyone reading a stack trace out of a GitHub issue.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Assets carry the versionCode as well as the tag. The tag alone is ambiguous — v1.0 says
          # nothing about which build it was — and versionCode is the one identifier shared with the
          # App Distribution builds, so mapping-1.0.164.txt can be matched to a crash by hand.
          V="${GITHUB_REF_NAME#v}.$(git rev-list --count HEAD)"
          cp app/build/outputs/apk/release/app-release.apk "jellyshelf-$V.apk"
          cp app/build/outputs/mapping/release/mapping.txt "mapping-$V.txt"
          gh release create "$GITHUB_REF_NAME" "jellyshelf-$V.apk" "mapping-$V.txt" \
            --generate-notes
