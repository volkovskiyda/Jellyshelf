# Copy to keystore.properties (git-ignored) and fill in to sign release builds.
# Without the real file assembleRelease still works — it just produces an unsigned APK.
# The keystore itself sits next to it at the repo root and is git-ignored too (*.jks).
KEYSTORE_FILE=jellyshelf-release.jks
KEYSTORE_PASSWORD=your-keystore-password
KEY_ALIAS=jellyshelf
