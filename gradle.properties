# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 4g rather than the 2g this file was generated with, which is the old AGP template default and
# tight for Compose compilation plus KSP (Room and Koin both generate here).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# The Kotlin compiler runs in its own daemon and inherits org.gradle.jvmargs when this is unset,
# which would silently claim a second 4g on top of Gradle's. Pinned so the ceiling is 6g, not 8g.
kotlin.daemon.jvmargs=-Xmx2048m
# Reuse task outputs across clean builds and branch switches, not just up-to-date checks. Local
# only — no remote cache is configured, so this costs a directory under ~/.gradle and nothing else.
org.gradle.caching=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Opens the screenshotTest source set for Compose Preview Screenshot Testing. Experimental flag
# required by the (alpha) com.android.compose.screenshot plugin; see app/build.gradle.kts.
android.experimental.enableScreenshotTest=true
# Stops the flag above printing "the option setting ... is experimental" on every build. Named per
# option rather than by warning type: android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# silences the same message, but it silences the warning for every other unsupported option too,
# including ones added later that nobody has weighed — measured, it swallowed a second experimental
# flag whole. This list still warns about those. The self-reference is not a typo: the property is
# itself an unsupported option, so leaving it out of its own list only trades one warning for another.
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.experimental.enableScreenshotTest
# Coordinates `./gradlew dependencyUpdates` must stop offering, because none of them is ours to
# declare — the plugin that pins each one is what moves it. Read by the ben-manes plugin applied
# from ~/.gradle/init.d/versions.gradle; -PallVersions bypasses this list.
#
# layoutlib, layoutlib-resources and junit-platform-launcher are transitives of the (alpha)
# com.android.compose.screenshot plugin, which the composeScreenshot comment in libs.versions.toml
# covers: forcing layoutlib changes the renderer behind every golden, and junit-platform has since
# renumbered 1.x -> 6.x while the alpha is still compiled against 1.x.
#
# kotlin-build-tools-impl is reported at 2.4.0 purely because KGP holds `{strictly 2.4.0}` on
# kotlinAbiValidationCompatClasspath — a fixed compat baseline, deliberately decoupled from the
# project's Kotlin version. The configurations that compile this app (kotlinBuildToolsApiClasspath,
# kotlinCompilerClasspath) already resolve to the kotlin ref, so the offer is a false positive.
dependencyUpdates.ignore=com.android.tools.layoutlib:layoutlib,com.android.tools.layoutlib:layoutlib-resources,org.junit.platform:junit-platform-launcher,org.jetbrains.kotlin:kotlin-build-tools-impl