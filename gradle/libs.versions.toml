[versions]
# Android SDK levels. minSdk and compileSdk are shared by :app and :baselineprofile — the
# macrobenchmark module instruments the app it profiles, so both must compile against the same
# platform and accept the same devices. targetSdk belongs to :app alone (a com.android.test module
# declares none) and holds its own ref rather than reusing compileSdk's: the two move at different
# times, since compiling against a new platform to see its warnings is a smaller step than opting
# into its behaviour changes.
minSdk = "31"
compileSdk = "37"
targetSdk = "37"
# One ref per artifact family (navigation3, adaptive, coroutines, room, ktor): the members ship as
# a set and must be bumped together, so a separate ref per artifact holding the same value is only
# a chance to update one and forget the others.
agp = "9.3.1"
kotlin = "2.4.10"
coreKtx = "1.19.0"
junit = "4.13.2"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
# Custom Tabs. Already present transitively through firebase-appdistribution, but that artifact is
# releaseImplementation-only, so the sign-in launcher would not compile on debug without this.
androidxBrowser = "1.10.0"
composeBom = "2026.08.00"
googleDevtoolsKsp = "2.3.11"
kotlinxSerializationJson = "1.11.0"
navigation3 = "1.1.6"
adaptive = "1.3.0"
roomRuntime = "2.8.4"
# One ref for coil-compose and coil-network-ktor3: same release train, bumped together.
coil = "3.5.0"
ktor = "3.5.2"
# Nothing declares OkHttp: it arrives under both HTTP clients in di/AppModule.kt as Ktor's engine
# (which asks for 5.3.2) and again through firebase-perf (4.12.0). This ref feeds a *constraint* in
# app/build.gradle.kts rather than a dependency, which is the only thing holding the app on 5.x —
# and, transitively, okio on 3.18.1 rather than 3.17.0.
okhttp = "5.5.0"
coroutines = "1.11.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# Declared only to raise it: Compose ui-test asks for espresso-core 3.4.0, which resolves to 3.5.0
# (Dec 2022) with nothing else in the graph naming a newer one. That version reflects on
# android.hardware.input.InputManager.getInstance, which Android 16 no longer has, so every test
# that touches the screen dies with NoSuchMethodException on an API 36 device.
androidxTestEspresso = "3.7.0"
datastorePreferences = "1.2.1"
material = "1.14.0"
media3 = "1.11.0"
workRuntimeKtx = "2.11.2"
youtubedlAndroid = "0.18.1"
timber = "5.0.1"
koinBom = "4.2.2"
# Static analysis. 1.23.8 is the current stable line; it embeds its own Kotlin parser, so it lags
# the project's Kotlin version without blocking it.
detekt = "1.23.8"
# Formatting, and the other half of that pair: detekt owns complexity, naming and style, ktlint owns
# layout. Two refs because the two halves version independently — ktlint-gradle only wires the
# engine into Gradle, while the engine decides how code is formatted. Pinning the engine rather than
# inheriting whatever default the plugin ships is what stops a plugin bump from silently
# reformatting the codebase; both are ours to move deliberately.
ktlint = "1.8.0"
ktlintGradle = "14.2.0"
# Compose Preview Screenshot Testing. Alpha and versioned independently of AGP; needs AGP 9.0+.
# This ref also decides two transitives that dependencyUpdates keeps offering newer versions of:
# layoutlib (the renderer behind the goldens) and the JUnit Platform line. Both are the plugin's
# choice, not ours, and both move only when it publishes — forcing them means re-rendering every
# LFS-tracked golden, or running an alpha compiled against JUnit Platform 1.x on 6.x.
composeScreenshot = "0.0.1-alpha16"
# Firebase. The BoM pins every SDK member, so firebase-crashlytics and firebase-perf carry no
# versions of their own. The three Gradle plugins version independently of the BoM and of each
# other: google-services reads app/google-services.json, firebase-crashlytics uploads the R8
# mapping file, perf-plugin weaves network/@AddTrace instrumentation into release bytecode
# (2.0.1 is the first release compatible with AGP 9).
googleServices = "4.5.0"
firebaseBom = "34.18.0"
# App Distribution is the exception to the BoM rule above: firebase-bom 34.17.0 lists 28 artifacts
# and none of them is an App Distribution one (verified 2026-08-06), so these two pin their own
# version — and need their own bump, which nothing else here does. Still upstream beta after years.
firebaseAppDistribution = "16.0.0-beta20"
firebaseCrashlyticsPlugin = "3.0.8"
firebasePerfPlugin = "2.0.2"
# Baseline profile. The benchmark family (the plugin and macro-junit4) ships as a set and shares one
# ref. This is a pre-release on purpose: 1.4.1 is the latest stable, but it refuses to apply to an
# AGP 9 application module ("Module `:app` is not a supported android module"), and 1.5.0-beta01 is
# the first version that accepts one. Drop back to stable once 1.5.0 ships.
# profileinstaller is the runtime half: it installs the committed profile on devices where ART does
# not pick it up by itself, and it versions independently of the benchmark family.
androidxBaselineProfile = "1.5.0-rc01"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"
# System tracing — the app-side half of the same measurement story the baseline profile serves.
# The sections it writes are what `:baselineprofile`'s TraceSectionMetric reads back, and they cost
# a branch when no trace is being captured, so they stay in every build type rather than being
# gated to one.
#
# 2.0.0 folded the old `tracing-ktx` artifact into this one: that coordinate still publishes at
# 2.0.0, but its classes.jar holds nothing but a version marker (checked, not assumed), so
# `trace("label") { }` and `traceAsync` now come from `tracing` itself. Declaring both would add a
# dependency that contributes no code.
androidxTracing = "2.0.0"

